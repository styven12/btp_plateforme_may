<!DOCTYPE html>
<!--
=====================================================================
 BTP-Vision — HOW THIS FILE IS BUILT (rebuild order, A to Z)
 One single .html file = 3 layers:
   1) HTML   : an empty shell (header + <main id="app">)  -> structure
   2) CSS    : the <style> block                            -> looks
   3) JS     : the <script> block                           -> behaviour
 The JS follows 8 numbered steps. Rebuild them in this order:
   STEP 1 constants  STEP 2 state+storage  STEP 3 helpers
   STEP 4 new project  STEP 5 building drawing  STEP 6 screens
   STEP 7 actions  STEP 8 render (router)
 Core idea: ONE object S holds all data. Every click changes S, saves it,
 then render() redraws the screen from S. (No framework needed.)
=====================================================================
-->

// api() : parle au serveur. Les erreurs deviennent des erreurs JS (e.status, e.data disponibles)
async function api(method,url,body){
 const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));
 if(r.status===401&&ME){ME=null;S=null;render();throw new Error("Session expirée, reconnectez-vous")}
 if(!r.ok){const e=new Error(d.error||r.status);e.status=r.status;e.data=d;throw e}
 return d;
}
function flash(m){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}
 t.textContent=m;t.style.display="block";clearTimeout(flash.t);flash.t=setTimeout(()=>t.style.display="none",4000)}

// FUSION À 3 VOIES : base = ce que j'avais chargé, mine = ma version, theirs = ce qui est maintenant sur le serveur.
// Chacun garde ses modifications ; si deux personnes changent EXACTEMENT la même valeur, c'est la mienne qui reste.
function merge3(b,m,t,key){
 const J=JSON.stringify;
 if(J(m)===J(t))return m;                 // identiques
 if(J(b)===J(m))return t;                 // je n'ai rien changé ici -> je prends la version des autres
 if(J(b)===J(t))return m;                 // les autres n'ont rien changé -> je garde la mienne
 if(Array.isArray(m)&&Array.isArray(t)){
  b=Array.isArray(b)?b:[];
  if(key==="phases")return m.length===t.length?m.map((x,i)=>merge3(b[i],x,t[i])):m;   // les 8 phases : fusion position par position
  const id=x=>x&&typeof x==="object"&&x.id?x.id:J(x);                                  // tâches/rapports : fusion par identifiant
  const B=new Map(b.map(x=>[id(x),x])),M=new Map(m.map(x=>[id(x),x])),out=[];
  for(const x of t){const k=id(x);if(M.has(k))out.push(merge3(B.get(k),M.get(k),x));else if(!B.has(k))out.push(x)} // ajouts des autres
  for(const x of m){const k=id(x);if(!t.some(y=>id(y)===k)&&!B.has(k))out.push(x)}                                // mes ajouts
  return out}
 if(m&&t&&typeof m==="object"&&typeof t==="object"){
  b=b&&typeof b==="object"&&!Array.isArray(b)?b:{};
  const o={};
  for(const k of new Set([...Object.keys(m),...Object.keys(t)])){const v=merge3(b[k],m[k],t[k],k);if(v!==undefined)o[k]=v}
  return o}
 return m}

// save() : appelée après CHAQUE modification. Attend 0,4 s puis envoie.
function save(){dirty=true;clearTimeout(t0);t0=setTimeout(push,400)}
async function push(){
 if(saving)return;saving=true;dirty=false;let merged=false;
 try{
  for(let i=0;i<5;i++){
   try{const r=await api("PUT","/api/state",{json:JSON.stringify(S),baseVersion:VER});
    VER=r.version;BASE=JSON.stringify(S);break}
   catch(e){
    if(e.status!==409)throw e;                       // 409 = quelqu'un a enregistré avant moi -> on fusionne, on ne l'écrase pas
    const th=e.data.json?JSON.parse(e.data.json):null,ba=BASE?JSON.parse(BASE):null;
    S=(!ba&&th)?th:merge3(ba,S,th);                  // si le projet vient d'être créé par un autre, on prend le sien
    VER=e.data.version;BASE=e.data.json;merged=true}
  }
 }catch(e){flash("⚠ Enregistrement impossible : "+e.message)}
 finally{saving=false}
 if(dirty)push();else if(merged){flash("Les modifications d'un collègue ont été fusionnées avec les vôtres.");softRender()}
}
// Toutes les 6 s : récupère les changements faits par les autres intervenants
async function poll(){
 if(!ME||saving||dirty)return;
 try{
  const j=await api("GET","/api/state?since="+VER);
  if(!j.unchanged&&!saving&&!dirty){S=j.json?JSON.parse(j.json):null;VER=j.version;BASE=j.json;softRender()}
  const e=await api("GET","/api/estimates");
  if(JSON.stringify(e)!==JSON.stringify(EST)){EST=e;if(view==="phase")softRender()}
 }catch(e){}
}
setInterval(poll,6000);
function softRender(){if(typing){needsRender=true;flash("Nouvelles données reçues : elles s'afficheront à votre prochaine action.");return}render()}
document.addEventListener("input",e=>{if(e.target.type!=="checkbox"&&e.target.type!=="file")typing=true});

const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
function migrate(){if(!S)return;S.reports=S.reports||[];S.phases.forEach(p=>p.tasks.forEach(t=>{t.id=t.id||uid()}))}

/* ===================== ÉTAPE 3 — OUTILS ===================== */
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); // empêche l'injection de HTML
const cls=s=>s.replace(/ /g,"");
const fmt=n=>Number(n).toLocaleString("fr-FR")+" FCFA";
const num=x=>Number(x).toLocaleString("fr-FR",{maximumFractionDigits:1});     // 5.25 -> "5,3"
const by=()=>ME?ME.name:"";
const log=t=>S.ev.push({d:today(),t,by:by()});              // journal : qui a fait quoi
const pct=p=>p.tasks.length?Math.round(p.tasks.filter(t=>t.d).length/p.tasks.length*100):(p.status==="Completed"?100:0);
const overall=()=>{const tasks=S.phases.flatMap(p=>p.tasks),done=tasks.filter(t=>t.d).length;return tasks.length?Math.round(done/tasks.length*100):0};
const badge=s=>`<span class="badge s-${cls(s)}">${STL[s]||s}</span>`;
// Formules PERT d'une tâche : moyenne = (o+4m+p)/6, écart-type = (p-o)/6
const pert=(o,m,p)=>({mean:(o+4*m+p)/6,sd:(p-o)/6});
const estLabel=id=>{const e=EST[id];if(!e)return"";const s=pert(e.o,e.m,e.p);return`⏱ μ = ${num(s.mean)} j · σ = ${num(s.sd)} j`};

 let k=0;const jobs=[];
 S.phases.forEach(p=>p.tasks.forEach(t=>{const m=[3,5,4,6,2,7][k++%6],o=Math.max(1,Math.round(m*.6*2)/2),pe=Math.round(m*1.8*2)/2;

 view="dash";save();render();await Promise.all(jobs);
}

// 6b. Tableau de bord
function dash(){
 const P=S.proj,done=S.phases.filter(p=>p.tasks.length&&p.tasks.every(t=>t.d)).length;
 const ai=S.phases.findIndex(p=>p.tasks.some(t=>!t.d));
 const act=ai>=0?S.phases[ai]:null;
 const nx=ai>=0?S.phases.slice(ai+1).find(p=>p.tasks.some(t=>!t.d)):null;
 const dn=S.phases.reduce((n,p)=>n+p.tasks.filter(t=>t.d).length,0),tt=S.phases.reduce((n,p)=>n+p.tasks.length,0);
 const feed=[...S.ev].reverse().slice(0,6).map(e=>`<div><span class="mu">${e.d}${e.by?" · "+esc(e.by):""}</span><br>${esc(e.t)}</div>`).join("");
 return `<div class="card"><h2>${esc(P.name)}</h2>
 <div class="mu">📍 ${esc(P.loc)} · ${P.start||"?"} → ${P.end||"?"} · ${fmt(P.budget)}</div>
 <div class="row"><b style="font-size:22px">${overall()}%</b><div class="bar" style="flex:1;min-width:120px"><i style="width:${overall()}%"></i></div></div></div>
 <div class="grid g4" style="margin-bottom:14px">
 <div class="card metric"><div class="n">${done}/8</div><div class="mu">Phases terminées</div></div>
 <div class="card metric"><div class="n" style="font-size:13px">${act?esc(act.name):"—"}</div><div class="mu">Phase active</div></div>
 <div class="card metric"><div class="n" style="font-size:13px">${nx?esc(nx.name):"—"}</div><div class="mu">Phase suivante</div></div>
 <div class="card metric"><div class="n">${dn}/${tt}</div><div class="mu">Tâches terminées</div></div></div>
 <div class="grid g2"><div class="card">${building()}</div><div class="card feed"><h2>Activité récente</h2>${feed}</div></div>
 <div class="card"><h2>Phases</h2>${S.phases.map((p,i)=>`<div class="pl" onclick="openPh(${i})"><div class="no">${i+1}</div>
 <div class="mid"><b>${esc(p.name)}</b><div class="bar"><i style="width:${pct(p)}%"></i></div></div>${badge(p.status)}</div>`).join("")}</div>`;
}

// 6c. Détail d'une phase : statut, dates, tâches (avec 3 durées PERT), photos, notes
function estBox(id){const e=EST[id]||{};return `<div class="estbox"><div class="dates3">
 <label>Optimiste o (jours)<input type="number" id="eo-${id}" min="0" step="0.5" value="${e.o??""}" oninput="estPreview('${id}')"></label>
 <label>Probable m (jours)<input type="number" id="em-${id}" min="0" step="0.5" value="${e.m??""}" oninput="estPreview('${id}')"></label>
 <label>Pessimiste p (jours)<input type="number" id="ep-${id}" min="0" step="0.5" value="${e.p??""}" oninput="estPreview('${id}')"></label></div>
 <div class="row"><button class="b alt" onclick="saveEstimate('${id}')">Enregistrer les durées</button><span class="mu" id="pv-${id}">${estLabel(id)}</span></div>
 <div class="mu">o = tout se passe bien · m = conditions normales · p = intempéries, retards de livraison… Moyenne = (o + 4m + p) / 6</div></div>`}
function phase(){
 const p=S.phases[cur];
 const dates=[["ts","Début prévu"],["as","Début réel"],["te","Fin prévue"],["ae","Fin réelle"]]
  .map(([k,l])=>`<div><label>${l}</label><input type="date" value="${p[k]}" onchange="setDate('${k}',this.value)"></div>`).join("");
 const tasks=p.tasks.map((t,j)=>`<div class="task ${t.d?"d":""}" style="flex-wrap:wrap"><input type="checkbox" ${t.d?"checked":""} onchange="tick(${j})"><span style="flex:1">${esc(t.t)}</span><span class="mu" id="es-${t.id}">${estLabel(t.id)}</span><button class="b gh" title="Durées PERT" onclick="toggleBox('est-${t.id}')">⏱</button><button class="b gh" title="Photos" onclick="toggleBox('box-${t.id}')">📎</button><div id="est-${t.id}" style="display:none;width:100%">${estBox(t.id)}</div><div id="box-${t.id}" style="display:none;width:100%">${attachBox('task',t.id)}</div></div>`).join("");
 const notes=p.notes.map(n=>`<div class="task"><span class="mu">${n.d}${n.by?" · "+esc(n.by):""}</span><span>${esc(n.t)}</span></div>`).join("");
 // Durée estimée de la phase = somme des moyennes ; écart-type = racine de la somme des variances
 let mu=0,va=0,nb=0;p.tasks.forEach(t=>{const e=EST[t.id];if(e){const s=pert(e.o,e.m,e.p);mu+=s.mean;va+=s.sd*s.sd;nb++}});
 const sum=nb?`<p class="mu">⏱ Durée estimée de la phase : <b>${num(mu)} j</b> (σ = ${num(Math.sqrt(va))} j) — ${nb}/${p.tasks.length} tâches estimées</p>`:"";
 return `<button class="b gh" style="margin-bottom:10px" onclick="view='dash';render()">← Tableau de bord</button>
 <div class="card"><h2>${cur+1}. ${esc(p.name)}</h2>
 <div class="row">${badge(p.status)}<select onchange="setStatus(this.value)">${STAT.map(s=>`<option value="${s}" ${s===p.status?"selected":""}>${STL[s]}</option>`).join("")}</select><b>${pct(p)}%</b></div>
 <div class="bar"><i style="width:${pct(p)}%"></i></div>${sum}<div class="dates" style="margin-top:12px">${dates}</div></div>
 <div class="card"><h3>Tâches</h3>${tasks}
 <div class="row"><input id="nt" placeholder="Nouvelle tâche" style="flex:1"><button class="b alt" onclick="addTask()">Ajouter</button></div></div>
 <div class="card"><h3>Photos de la phase</h3>${attachBox('phase','p'+cur)}</div>
 <div class="card"><h3>Observations</h3>${notes}
 <div class="row"><input id="nn" placeholder="Observation" style="flex:1"><button class="b alt" onclick="addNote()">Ajouter</button></div></div>`;
}

/* ===================== ÉTAPE 7 — ACTIONS (modifient S, enregistrent, redessinent) ===================== */
function openPh(i){cur=i;view="phase";render()}
function setStatus(s){const p=S.phases[cur];p.status=s;
 if(s==="Completed"){p.tasks.forEach(t=>t.d=true);p.ae=p.ae||today()}
 if(s==="In Progress"&&!p.as)p.as=today();
 log(`${p.name} : ${STL[s]}`);save();render()}
function setDate(k,v){S.phases[cur][k]=v;save()}
function tick(j){const p=S.phases[cur],t=p.tasks[j];t.d=!t.d;
 if(t.d)log(`Tâche terminée : ${t.t}`);
 if(p.tasks.every(x=>x.d)&&p.status!=="Completed"){p.status="Completed";p.ae=today();log(`${p.name} terminée`)}
 else if(t.d&&p.status==="Not Started"){p.status="In Progress";p.as=p.as||today();log(`${p.name} démarrée`)}
 save();render()}
function addTask(){const v=document.getElementById("nt").value.trim();if(!v)return;S.phases[cur].tasks.push({id:uid(),t:v,d:false});save();render()}
function addNote(){const v=document.getElementById("nn").value.trim();if(!v)return;S.phases[cur].notes.push({d:today(),t:v,by:by()});log("Observation ajoutée");save();render()}

// ---- 7a. Durées PERT d'une tâche ----
function toggleBox(id){const b=document.getElementById(id);b.style.display=b.style.display==="none"?"block":"none"}   // id = id complet de la boîte
function estPreview(id){const g=k=>parseFloat(document.getElementById(k+"-"+id).value),o=g("eo"),m=g("em"),p=g("ep"),pv=document.getElementById("pv-"+id);
 if([o,m,p].some(isNaN)){pv.textContent="";return}
 if(!(o<=m&&m<=p)){pv.textContent="⚠ il faut o ≤ m ≤ p";return}
 const s=pert(o,m,p);pv.textContent=`μ = ${num(s.mean)} j · σ = ${num(s.sd)} j`}
async function saveEstimate(taskId){
 const g=k=>parseFloat(document.getElementById(k+"-"+taskId).value);
 const optimistic=g("eo"),probable=g("em"),pessimistic=g("ep");
 if([optimistic,probable,pessimistic].some(isNaN))return alert("Remplissez les trois durées.");
 try{
  await api("PUT","/api/estimates/"+encodeURIComponent(taskId),{optimistic,probable,pessimistic});
  EST[taskId]={o:optimistic,m:probable,p:pessimistic,by:by()};
  document.getElementById("es-"+taskId).textContent=estLabel(taskId);
  flash("Durées enregistrées.");
 }catch(e){alert(e.message)}
}

// ---- 7b. Photos (pour tâches, phases, rapports) ----
function shrink(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,1280/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
 c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(f)})}
function attachBox(type,id){return `<div class="gal" data-type="${type}" data-id="${id}"></div><div class="row">
 <input type="file" id="f-${id}" accept="image/*" capture="environment" multiple>
 <input id="d-${id}" placeholder="Description" style="flex:1"><button class="b alt" onclick="sendFiles('${type}','${id}')">Joindre</button></div>`}
async function sendFiles(type,id){
 const files=[...document.getElementById("f-"+id).files],d=document.getElementById("d-"+id).value;
 if(!files.length)return alert("Choisissez d'abord une photo.");
 try{for(const f of files)await api("POST","/api/attachments",{ownerType:type,ownerId:id,description:d,dataUrl:await shrink(f)});
  document.getElementById("f-"+id).value="";document.getElementById("d-"+id).value="";loadGalleries()}
 catch(e){alert("Échec de l'envoi : "+e.message)}}
async function loadGalleries(){for(const g of document.querySelectorAll(".gal[data-id]")){try{
 const l=await api("GET",`/api/attachments?ownerType=${g.dataset.type}&ownerId=${encodeURIComponent(g.dataset.id)}`);
 g.innerHTML=l.map(a=>`<figure><img loading="lazy" src="/uploads/${a.file}" onclick="window.open('/uploads/${a.file}')">${esc(a.description)} <a href="#" onclick="delAtt('${a.id}');return false">✕</a></figure>`).join("")||'<span class="mu">Aucune photo.</span>'}catch(e){}}}
async function delAtt(id){if(confirm("Supprimer cette photo ?")){await api("DELETE","/api/attachments/"+id).catch(e=>alert(e.message));loadGalleries()}}

// ---- 7d. SIMULATION PROBABILISTE ----
function sim(){return `<div class="card"><h2>Simulation probabiliste de fin de chantier</h2>
 <p class="mu">Les estimations optimiste, probable et pessimiste sont lues dans MySQL. Pour chaque scénario, une durée est tirée selon Bêta-PERT, puis les tâches sont additionnées dans leur ordre. Les tirages étant aléatoires, les résultats peuvent légèrement varier à chaque calcul.</p>
 <div class="row"><label><input type="checkbox" ${SIM.remaining?"checked":""} onchange="SIM.remaining=this.checked;runSim()"> Tâches restantes seulement</label>
 <input id="st" type="number" min="0" step="1" placeholder="Délai visé (jours)" value="${esc(SIM.target)}" onkeydown="if(event.key==='Enter')applyTarget()">
 <button class="b" onclick="applyTarget()">Calculer</button></div></div><div id="simbox"><p class="mu">Calcul en cours…</p></div>`}
function applyTarget(){SIM.target=document.getElementById("st").value;runSim()}
function showSimulation(){view="sim";render()}                 // bouton « Simulation » de la navigation
async function runSim(){
 const box=document.getElementById("simbox");if(!box)return;
 try{
  const d=await api("GET","/api/simulation?remaining="+(SIM.remaining?1:0)+(SIM.target!==""?"&target="+encodeURIComponent(SIM.target):""));
  if(d.error){box.innerHTML=`<div class="card"><p>${esc(d.error)}</p></div>`;return}
  const sourceNote=d.source?`<div class="source-note"><b>Source du calcul :</b> ${d.source.usedEstimateCount} estimations PERT enregistrées dans MySQL · état du projet ${d.source.stateVersion}${d.source.lastEstimateUpdatedAt?` · dernière estimation modifiée le ${esc(d.source.lastEstimateUpdatedAt)}`:""}.</div>`:"";
  const miss=d.missing.length?`<div class="warn">⚠ ${d.missing.length} tâche(s) sans durées ne sont pas comptées (ex. : ${esc(d.missing.slice(0,3).map(t=>t.label).join(", "))}). Le résultat est donc <b>sous-estimé</b> tant qu'elles ne sont pas renseignées (bouton ⏱ dans la phase).</div>`:"";
  const prob=d.target!==undefined?`<div class="card"><h2>${Math.round(d.probTarget*100)} % de chances de finir en ${num(d.target)} jours</h2>
   <p class="mu">Simulation de Monte Carlo. Approximation par la loi normale (μ, σ) : ${Math.round(d.probTargetNormal*100)} %.</p></div>`:"";
  box.innerHTML=`${sourceNote}${miss}
  <div class="grid g4" style="margin-bottom:14px">
   <div class="card metric"><div class="n">${num(d.mean)} j</div><div class="mu">Durée moyenne (μ)</div></div>
   <div class="card metric"><div class="n">${num(d.sd)} j</div><div class="mu">Écart-type (σ)</div></div>
   <div class="card metric"><div class="n">${d.nbTasks}</div><div class="mu">Tâches simulées</div></div>
   <div class="card metric"><div class="n">${d.iterations}</div><div class="mu">Tirages de Monte Carlo</div></div></div>${prob}
  <div class="card"><ul>
   <li><b>${num(d.p10)} jours</b> : scénario optimiste (10 % de chances de finir avant)</li>
   <li><b>${num(d.p50)} jours</b> : scénario médian (50 % de chances)</li>
   <li><b>${num(d.p80)} jours</b> : scénario prudent — recommandé pour planifier (80 % de chances)</li>
   <li><b>${num(d.p90)} jours</b> : scénario pessimiste (90 % de chances)</li></ul>
   <canvas id="hist-canvas" width="700" height="300"></canvas>
   <div class="mu">Chaque barre = nombre de tirages qui ont fini à cette durée. Traits : médiane (gris), P80 (orange)${d.target!==undefined?", délai visé (vert)":""}.</div></div>
  <div class="card"><h3>Tâches qui pèsent le plus sur l'incertitude</h3><div class="tw"><table>
   <tr><th>Tâche</th><th class="n">o</th><th class="n">m</th><th class="n">p</th><th class="n">μ</th><th class="n">σ</th><th class="n">Part</th></tr>
   ${d.tasks.map(t=>`<tr><td>${esc(t.label)}<br><span class="mu">${esc(t.phase)}</span></td><td class="n">${num(t.o)}</td><td class="n">${num(t.m)}</td><td class="n">${num(t.p)}</td>
   <td class="n">${num(t.mean)}</td><td class="n">${num(t.sd)}</td><td class="n">${Math.round(t.share*100)} %</td></tr>`).join("")}</table></div></div>`;
  drawHistogram(d.histogram,[{v:d.p50,c:"#64748b"},{v:d.p80,c:"#f97316"},...(d.target!==undefined?[{v:d.target,c:"#16a34a"}]:[])],d.target);
 }catch(e){box.innerHTML=`<div class="card"><p>${esc(e.message)}</p></div>`}
}
function drawHistogram(h,marks=[],target){
 const canvas=document.getElementById("hist-canvas");if(!canvas)return;
 const ctx=canvas.getContext("2d"),maxCount=Math.max(...h.counts),barWidth=canvas.width/h.counts.length,span=(h.max-h.min)||1;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 h.counts.forEach((count,i)=>{
  const barHeight=(count/maxCount)*(canvas.height-30),right=h.min+(i+1)*h.width;
  ctx.fillStyle=(target!==undefined&&right<=target)?"#16a34a":"#2E5B88";        // barres vertes = finies dans le délai visé
  ctx.fillRect(i*barWidth+1,canvas.height-barHeight-20,barWidth-2,barHeight)});
 marks.forEach(m=>{const x=(m.v-h.min)/span*canvas.width;if(x<0||x>canvas.width)return;
  ctx.strokeStyle=m.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height-20);ctx.stroke()});
 ctx.fillStyle="#333";ctx.font="12px sans-serif";
 ctx.fillText(Math.round(h.min)+" j",2,canvas.height-2);
 ctx.fillText(Math.round(h.max)+" j",canvas.width-40,canvas.height-2);
}

 if(!S){nav.innerHTML=`<button class="${view==="compte"?"on":""}" aria-current="${view==="compte"?"page":"false"}" onclick="view='compte';render()"><span class="nav-icon" aria-hidden="true">●</span><span>Compte</span></button>`;
  app.innerHTML=view==="compte"?compte():welcome();return}
 migrate();
 const tabs=[["dash","Vue d'ensemble","⌂"],["phase","Phases","▤"],["journal","Journal","◷"],["reports","Rapports","▣"],["sim","Simulation","◌"]];
 if(ME.role==="admin")tabs.push(["admin","Administration","⚙"]);

 const html={dash,phase,journal,reports,sim,admin,compte}[view]();
 app.innerHTML=RO()?`<fieldset disabled>${html}</fieldset>`:html;      // lecture seule : champs et boutons grisés
 window.scrollTo(0,0);loadGalleries();
 if(view==="sim")runSim();if(view==="admin")loadUsers();
}
