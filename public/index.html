<!DOCTYPE html>
<!--
=====================================================================
 BTP-Vision — HOW THIS FILE IS BUILT (rebuild order, A to Z)
 One single .html file = 3 layers:
   1) HTML   : an empty shell (header + <main id="app">)  -> structure
   2) CSS    : the <style> block                            -> looks
   3) JS     : the <script> block                           -> behaviour
 The JS follows 8 numbered steps. Rebuild them in this order:
   STEP 1 constants  STEP 2 state+storage  STEP 3 helpers
   STEP 4 new project  STEP 5 building drawing  STEP 6 screens
   STEP 7 actions  STEP 8 render (router)
 Core idea: ONE object S holds all data. Every click changes S, saves it,
 then render() redraws the screen from S. (No framework needed.)
=====================================================================
-->
<html lang="en"><head>
<meta charset="utf-8"> <!-- text encoding, needed for accents like "é" -->
<!-- viewport: makes the page fit phone screens; viewport-fit=cover lets it use the full screen -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTP-Vision</title>
<!-- Montserrat font from Google Fonts (400 normal, 600 semi-bold, 800 extra-bold) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ---------- CSS VARIABLES: change a colour here, it changes everywhere ---------- */
:root{
 color-scheme:light;                 /* force a light interface */
 box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);       /* keep content below the phone status bar */
 padding-bottom:env(safe-area-inset-bottom,0px); /* ...and above the phone home bar */
 --bg:#fff; --tx:#1e2a36; --mu:#64748b; --bd:#e2e8f0;          /* white bg, text, muted text, borders */
 --or:#f97316; --bl:#1d5fd1; --gr:#16a34a; --gy:#94a3b8; --sl:#334155; /* orange, blue, green, gray, slate */
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}             /* padding counts inside element width */
body{margin:0;background:var(--bg);color:var(--tx);
 font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif; /* Montserrat, with fallbacks */
 font-size:14px;line-height:1.5}

/* ---------- HEADER + NAVIGATION ---------- */
header{padding:14px 16px 0;border-bottom:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#who{font-size:12px;color:var(--mu);display:flex;gap:8px;align-items:center}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--or)}   /* "BTP" dark, "-Vision" orange */
nav{display:flex;gap:4px;margin-top:8px;overflow-x:auto}        /* scrolls sideways if too narrow */
nav button{background:none;border:0;font:inherit;color:var(--mu);padding:10px 14px;cursor:pointer;
 border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--tx);font-weight:600;border-color:var(--or)} /* active tab: orange underline */

/* ---------- LAYOUT ---------- */
main{max-width:1000px;margin:0 auto;padding:16px}   /* centred column */
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px;
 box-shadow:0 1px 3px rgba(15,23,42,.06)}
.grid{display:grid;gap:14px}                         /* grid container */
.g4{grid-template-columns:repeat(2,1fr)}             /* mobile: 2 columns for metrics */
@media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}   /* desktop: 4 columns */
 .g2{grid-template-columns:1.4fr 1fr}}               /* desktop: diagram wide, feed narrow */
h2{margin:0 0 10px;font-size:17px}h3{margin:0 0 6px;font-size:15px}
.mu{color:var(--mu);font-size:13px}
.metric{text-align:center;margin:0}.metric .n{font-size:18px;font-weight:800;color:var(--bl)}

/* ---------- PROGRESS BAR + STATUS BADGES ---------- */
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gr);transition:width .4s}  /* the green fill */
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.s-Completed{background:var(--gr)}.s-InProgress{background:var(--bl)}.s-NotStarted{background:var(--gy)}
.s-Delayed{background:var(--or)}.s-OnHold{background:#7c3aed}   /* class name = status without spaces */

/* ---------- PHASE LIST ROWS ---------- */
.pl{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:10px;
 margin-bottom:8px;cursor:pointer}
.pl:hover{border-color:var(--bl)}
.pl .no{width:30px;height:30px;border-radius:50%;background:var(--sl);color:#fff;display:grid;
 place-items:center;font-weight:600;flex:none}              /* round number bubble */
.pl .mid{flex:1;min-width:0}.pl .bar{height:6px;margin-top:5px}

/* ---------- FEED, TIMELINE, TASKS ---------- */
.feed div{padding:8px 0;border-bottom:1px solid var(--bd)}
.tl{border-left:3px solid var(--bl);margin-left:8px;padding-left:16px}   /* vertical blue line */
.tl .e{position:relative;padding-bottom:16px}
.tl .e:before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;
 border-radius:50%;background:var(--or);border:2px solid #fff}          /* orange dot on the line */
.task{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.task.d span{text-decoration:line-through;color:var(--mu)}              /* done task = struck through */

/* ---------- FORMS + BUTTONS ---------- */
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);max-width:100%}
.b{font:inherit;padding:8px 14px;border:0;border-radius:8px;background:var(--or);color:#fff;font-weight:600;cursor:pointer}
.b.alt{background:var(--bl)}.b.gh{background:#fff;color:var(--mu);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}              /* 2-column form */
.dates label{display:block;font-size:12px;color:var(--mu)}.dates input{width:100%}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gal figure{margin:0;font-size:12px}.gal img{width:100%;height:100px;object-fit:cover;border-radius:8px}
svg{width:100%;height:auto;display:block}.ly{transition:opacity .5s}   /* building layers fade smoothly */
.hero{max-width:520px;margin:20px auto}

/* ---------- COMPTES, ESTIMATIONS PERT, SIMULATION ---------- */
fieldset{border:0;padding:0;margin:0;min-width:0}               /* compte en lecture seule : tout est grisé */
.dates3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dates3 label{display:block;font-size:12px;color:var(--mu)}.dates3 input{width:100%}
.estbox{width:100%;background:#f8fafc;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:6px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}td.n,th.n{text-align:right;white-space:nowrap}
canvas{width:100%;height:auto;display:block}
.warn{background:#fff7ed;border:1px solid #fdba74;border-radius:10px;padding:10px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--sl);color:#fff;padding:10px 16px;
 border-radius:10px;font-size:13px;z-index:9;max-width:90%}
</style></head>
<body>
<header><div class="top"><div class="logo">BTP<b>-Vision</b></div><div id="who"></div></div><nav id="nav"></nav></header>
<main id="app"></main>
<script>
/* ===================== ÉTAPE 1 — CONSTANTES ===================== */
const NAMES=["Préparation du site & terrassement","Fondations & infrastructure","Ossature (structure)","Murs & maçonnerie",
 "Toiture & charpente","Lots techniques (plomberie, électricité)","Finitions & menuiserie","Contrôle & réception"]; // les 8 phases
// Les statuts gardent leur valeur interne (anglais) pour ne pas casser les anciennes données ; STL = texte affiché
const STAT=["Not Started","In Progress","Completed","Delayed","On Hold"];
const STL={"Not Started":"Non démarré","In Progress":"En cours","Completed":"Terminé","Delayed":"En retard","On Hold":"Suspendu"};
const TASKS=[["Débroussaillage","Implantation & relevé","Terrassement au niveau"],["Fouilles des semelles","Pose du ferraillage","Coulage du béton"],
 ["Poteaux","Poutres","Coulage de la dalle"],["Blocs du rez-de-chaussée","Linteaux","Blocs de l'étage"],
 ["Assemblage de la charpente","Tôles de toiture","Gouttières"],["Plomberie (gros œuvre)","Gaines électriques","Essais"],
 ["Enduit","Carrelage","Portes & fenêtres","Peinture"],["Liste des réserves","Inspection finale","Réception & remise des clés"]];
// Tous les intervenants d'un chantier (même liste que le serveur)
const ROLEL={admin:"Administrateur",maitre_ouvrage:"Maître d'ouvrage",maitre_oeuvre:"Maître d'œuvre / Architecte",bet:"Bureau d'études (BET)",
 controle:"Bureau de contrôle",conducteur:"Conducteur de travaux",chef_chantier:"Chef de chantier",entreprise:"Entreprise / sous-traitant",
 fournisseur:"Fournisseur",lecteur:"Observateur (lecture seule)"};

/* ===================== ÉTAPE 2 — ÉTAT + COMMUNICATION AVEC LE SERVEUR ===================== */
let S=null;                       // S = toutes les données du projet (ou null = pas encore de projet)
let ME=null,SETUP=false;          // ME = utilisateur connecté ; SETUP = aucun compte n'existe encore
let EST={};                       // EST = durées PERT {idTâche:{o,m,p,by}}
let view="dash",cur=0;
let VER=0,BASE=null;              // VER = n° de version vu sur le serveur ; BASE = dernier état connu du serveur (texte JSON)
let dirty=false,saving=false,t0;  // dirty = modif pas encore envoyée ; saving = envoi en cours
let typing=false,needsRender=false; // typing = quelqu'un tape dans un champ : on ne redessine pas l'écran sous ses doigts
const SIM={target:"",remaining:true};
const RO=()=>ME&&ME.role==="lecteur";

// api() : parle au serveur. Les erreurs deviennent des erreurs JS (e.status, e.data disponibles)
async function api(method,url,body){
 const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
 const d=await r.json().catch(()=>({}));
 if(r.status===401&&ME){ME=null;S=null;render();throw new Error("Session expirée, reconnectez-vous")}
 if(!r.ok){const e=new Error(d.error||r.status);e.status=r.status;e.data=d;throw e}
 return d;
}
function flash(m){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}
 t.textContent=m;t.style.display="block";clearTimeout(flash.t);flash.t=setTimeout(()=>t.style.display="none",4000)}

// FUSION À 3 VOIES : base = ce que j'avais chargé, mine = ma version, theirs = ce qui est maintenant sur le serveur.
// Chacun garde ses modifications ; si deux personnes changent EXACTEMENT la même valeur, c'est la mienne qui reste.
function merge3(b,m,t,key){
 const J=JSON.stringify;
 if(J(m)===J(t))return m;                 // identiques
 if(J(b)===J(m))return t;                 // je n'ai rien changé ici -> je prends la version des autres
 if(J(b)===J(t))return m;                 // les autres n'ont rien changé -> je garde la mienne
 if(Array.isArray(m)&&Array.isArray(t)){
  b=Array.isArray(b)?b:[];
  if(key==="phases")return m.length===t.length?m.map((x,i)=>merge3(b[i],x,t[i])):m;   // les 8 phases : fusion position par position
  const id=x=>x&&typeof x==="object"&&x.id?x.id:J(x);                                  // tâches/rapports : fusion par identifiant
  const B=new Map(b.map(x=>[id(x),x])),M=new Map(m.map(x=>[id(x),x])),out=[];
  for(const x of t){const k=id(x);if(M.has(k))out.push(merge3(B.get(k),M.get(k),x));else if(!B.has(k))out.push(x)} // ajouts des autres
  for(const x of m){const k=id(x);if(!t.some(y=>id(y)===k)&&!B.has(k))out.push(x)}                                // mes ajouts
  return out}
 if(m&&t&&typeof m==="object"&&typeof t==="object"){
  b=b&&typeof b==="object"&&!Array.isArray(b)?b:{};
  const o={};
  for(const k of new Set([...Object.keys(m),...Object.keys(t)])){const v=merge3(b[k],m[k],t[k],k);if(v!==undefined)o[k]=v}
  return o}
 return m}

// save() : appelée après CHAQUE modification. Attend 0,4 s puis envoie.
function save(){dirty=true;clearTimeout(t0);t0=setTimeout(push,400)}
async function push(){
 if(saving)return;saving=true;dirty=false;let merged=false;
 try{
  for(let i=0;i<5;i++){
   try{const r=await api("PUT","/api/state",{json:JSON.stringify(S),baseVersion:VER});
    VER=r.version;BASE=JSON.stringify(S);break}
   catch(e){
    if(e.status!==409)throw e;                       // 409 = quelqu'un a enregistré avant moi -> on fusionne, on ne l'écrase pas
    const th=e.data.json?JSON.parse(e.data.json):null,ba=BASE?JSON.parse(BASE):null;
    S=(!ba&&th)?th:merge3(ba,S,th);                  // si le projet vient d'être créé par un autre, on prend le sien
    VER=e.data.version;BASE=e.data.json;merged=true}
  }
 }catch(e){flash("⚠ Enregistrement impossible : "+e.message)}
 finally{saving=false}
 if(dirty)push();else if(merged){flash("Les modifications d'un collègue ont été fusionnées avec les vôtres.");softRender()}
}
// Toutes les 6 s : récupère les changements faits par les autres intervenants
async function poll(){
 if(!ME||saving||dirty)return;
 try{
  const j=await api("GET","/api/state?since="+VER);
  if(!j.unchanged&&!saving&&!dirty){S=j.json?JSON.parse(j.json):null;VER=j.version;BASE=j.json;softRender()}
  const e=await api("GET","/api/estimates");
  if(JSON.stringify(e)!==JSON.stringify(EST)){EST=e;if(view==="phase")softRender()}
 }catch(e){}
}
setInterval(poll,6000);
function softRender(){if(typing){needsRender=true;flash("Nouvelles données reçues : elles s'afficheront à votre prochaine action.");return}render()}
document.addEventListener("input",e=>{if(e.target.type!=="checkbox"&&e.target.type!=="file")typing=true});

const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
function migrate(){if(!S)return;S.reports=S.reports||[];S.phases.forEach(p=>p.tasks.forEach(t=>{t.id=t.id||uid()}))}

/* ===================== ÉTAPE 3 — OUTILS ===================== */
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); // empêche l'injection de HTML
const cls=s=>s.replace(/ /g,"");
const fmt=n=>Number(n).toLocaleString("fr-FR")+" FCFA";
const num=x=>Number(x).toLocaleString("fr-FR",{maximumFractionDigits:1});     // 5.25 -> "5,3"
const by=()=>ME?ME.name:"";
const log=t=>S.ev.push({d:today(),t,by:by()});              // journal : qui a fait quoi
const pct=p=>p.status==="Completed"?100:Math.round(p.tasks.filter(t=>t.d).length/Math.max(1,p.tasks.length)*100);
const overall=()=>Math.round(S.phases.reduce((a,p)=>a+pct(p),0)/8);
const badge=s=>`<span class="badge s-${cls(s)}">${STL[s]||s}</span>`;
// Formules PERT d'une tâche : moyenne = (o+4m+p)/6, écart-type = (p-o)/6
const pert=(o,m,p)=>({mean:(o+4*m+p)/6,sd:(p-o)/6});
const estLabel=id=>{const e=EST[id];if(!e)return"";const s=pert(e.o,e.m,e.p);return`⏱ μ = ${num(s.mean)} j · σ = ${num(s.sd)} j`};

/* ===================== ÉTAPE 4 — NOUVEAU PROJET ===================== */
const newPhases=()=>NAMES.map((n,i)=>({name:n,status:"Not Started",ts:"",as:"",te:"",ae:"",
 tasks:TASKS[i].map(t=>({id:uid(),t,d:false})),photos:[],notes:[]}));
function startProject(){
 const g=id=>document.getElementById(id).value.trim();
 if(!g("wn"))return alert("Entrez le nom du projet.");
 S={proj:{name:g("wn"),loc:g("wl"),start:g("ws"),end:g("we"),budget:+g("wb")||0},
    phases:newPhases(),ev:[{d:today(),t:"Projet créé",by:by()}]};
 view="dash";save();render();
}
// Démo : projet pré-rempli AVEC des durées PERT d'exemple, pour tester la simulation tout de suite
async function loadDemo(){
 S={proj:{name:"Villa R+1 Bonamoussadi",loc:"Douala, Cameroun",start:"2026-06-01",end:"2027-03-31",budget:45000000},
    phases:newPhases(),ev:[{d:"2026-06-01",t:"Début de la préparation du site",by:by()},{d:"2026-07-20",t:"Fondations terminées",by:by()}]};
 [0,1].forEach(i=>{const p=S.phases[i];p.status="Completed";p.tasks.forEach(t=>t.d=true);p.as="2026-06-01";p.ae="2026-07-20"});
 S.phases[2].status="In Progress";S.phases[2].tasks[0].d=true;S.phases[2].as="2026-07-22";
 let k=0;const jobs=[];
 S.phases.forEach(p=>p.tasks.forEach(t=>{const m=[3,5,4,6,2,7][k++%6],o=Math.max(1,Math.round(m*.6*2)/2),pe=Math.round(m*1.8*2)/2;
  EST[t.id]={o,m,p:pe,by:by()};jobs.push(api("PUT","/api/estimates/"+encodeURIComponent(t.id),{optimistic:o,probable:m,pessimistic:pe}).catch(()=>{}))}));
 view="dash";save();render();await Promise.all(jobs);
}

/* ===================== ÉTAPE 5 — LE BÂTIMENT QUI SE CONSTRUIT (SVG) ===================== */
const LAYERS=[
 '<rect x="40" y="168" width="320" height="7" fill="#8b6b3d"/>',
 '<rect x="80" y="175" width="240" height="14" fill="#64748b"/>',
 '<path d="M95 175V90M200 175V90M305 175V90" stroke="#475569" stroke-width="7"/><rect x="85" y="84" width="230" height="7" fill="#94a3b8"/>',
 '<rect x="98" y="91" width="204" height="84" fill="#d6a67a"/>',
 '<path d="M70 86L200 28L330 86Z" fill="#c2410c"/>',
 '<path d="M110 100v70" stroke="#2563eb" stroke-width="3"/><path d="M290 100v70" stroke="#facc15" stroke-width="3"/>',
 '<rect x="120" y="105" width="28" height="22" fill="#7dd3fc"/><rect x="252" y="105" width="28" height="22" fill="#7dd3fc"/><rect x="180" y="135" width="40" height="40" fill="#78350f"/>',
 '<path d="M330 175V100" stroke="#334155" stroke-width="2"/><path d="M330 100h40l-8 10 8 10h-40z" fill="#16a34a"/>'
];
function building(){
 const o=p=>p.status==="Completed"?1:(p.status==="In Progress"?.5:.08);
 return `<svg viewBox="0 0 400 230" role="img" aria-label="Avancement du bâtiment">
 <rect width="400" height="230" fill="#e0f2fe"/><rect y="175" width="400" height="55" fill="#a8895f"/>
 ${LAYERS.map((l,i)=>`<g class="ly" style="opacity:${o(S.phases[i])}">${l}</g>`).join("")}</svg>`;
}

/* ===================== ÉTAPE 6 — ÉCRANS (chacun renvoie du HTML) ===================== */
// 6-0. Connexion / première configuration (compte administrateur)
function loginScreen(){
 if(SETUP)return `<div class="card hero"><h2>Première utilisation</h2>
 <p class="mu">Créez le compte <b>administrateur</b>. Il pourra ensuite créer un compte pour chaque intervenant.</p>
 <div class="dates"><div><label>Nom complet</label><input id="sn" placeholder="Jean Mballa"></div>
 <div><label>Identifiant</label><input id="su" placeholder="jmballa" autocapitalize="none"></div>
 <div><label>Mot de passe (6 caractères min.)</label><input id="sp" type="password" onkeydown="if(event.key==='Enter')doSetup()"></div></div>
 <div class="row"><button class="b" onclick="doSetup()">Créer le compte administrateur</button></div></div>`;
 return `<div class="card hero"><h2>Connexion</h2>
 <p class="mu">Chaque intervenant du chantier a son propre compte.</p>
 <div class="dates"><div><label>Identifiant</label><input id="lu" autocapitalize="none" autocomplete="username"></div>
 <div><label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div></div>
 <div class="row"><button class="b" onclick="doLogin()">Se connecter</button></div></div>`;
}
async function doLogin(){
 try{await api("POST","/api/login",{username:document.getElementById("lu").value,password:document.getElementById("lp").value});await boot()}
 catch(e){alert(e.message)}
}
async function doSetup(){
 const g=i=>document.getElementById(i).value;
 try{await api("POST","/api/setup",{name:g("sn"),username:g("su"),password:g("sp")});await boot()}
 catch(e){alert(e.message)}
}
async function logout(){try{await api("POST","/api/logout")}catch(e){}ME=null;S=null;EST={};render()}

// 6a. Accueil : affiché quand il n'y a pas encore de projet
function welcome(){
 if(RO())return `<div class="card hero"><h2>Aucun projet pour le moment</h2><p class="mu">Un intervenant doit d'abord créer le projet.</p></div>`;
 return `<div class="card hero"><h2>Démarrer un projet de construction</h2>
 <p class="mu">Renseignez l'essentiel. Les 8 phases standard sont créées automatiquement.</p>
 <div class="dates">
 <div><label>Nom du projet *</label><input id="wn" placeholder="Villa R+1"></div>
 <div><label>Lieu</label><input id="wl" placeholder="Yaoundé"></div>
 <div><label>Date de début</label><input id="ws" type="date" value="${today()}"></div>
 <div><label>Fin prévue</label><input id="we" type="date"></div>
 <div><label>Budget (FCFA)</label><input id="wb" type="number" placeholder="45000000"></div></div>
 <div class="row"><button class="b" onclick="startProject()">Démarrer le projet</button>
 <button class="b gh" onclick="loadDemo()">Explorer avec des données de démo</button></div></div>`}

// 6b. Tableau de bord
function dash(){
 const P=S.proj,done=S.phases.filter(p=>p.status==="Completed").length;
 const ai=S.phases.findIndex(p=>p.status!=="Completed");
 const act=S.phases.find(p=>p.status==="In Progress")||S.phases[ai];
 const nx=ai>=0?S.phases[ai+1]:null;
 const dn=S.phases.reduce((n,p)=>n+p.tasks.filter(t=>t.d).length,0),tt=S.phases.reduce((n,p)=>n+p.tasks.length,0);
 const feed=[...S.ev].reverse().slice(0,6).map(e=>`<div><span class="mu">${e.d}${e.by?" · "+esc(e.by):""}</span><br>${esc(e.t)}</div>`).join("");
 return `<div class="card"><h2>${esc(P.name)}</h2>
 <div class="mu">📍 ${esc(P.loc)} · ${P.start||"?"} → ${P.end||"?"} · ${fmt(P.budget)}</div>
 <div class="row"><b style="font-size:22px">${overall()}%</b><div class="bar" style="flex:1;min-width:120px"><i style="width:${overall()}%"></i></div></div></div>
 <div class="grid g4" style="margin-bottom:14px">
 <div class="card metric"><div class="n">${done}/8</div><div class="mu">Phases terminées</div></div>
 <div class="card metric"><div class="n" style="font-size:13px">${act?esc(act.name):"—"}</div><div class="mu">Phase active</div></div>
 <div class="card metric"><div class="n" style="font-size:13px">${nx?esc(nx.name):"—"}</div><div class="mu">Phase suivante</div></div>
 <div class="card metric"><div class="n">${dn}/${tt}</div><div class="mu">Tâches terminées</div></div></div>
 <div class="grid g2"><div class="card">${building()}</div><div class="card feed"><h2>Activité récente</h2>${feed}</div></div>
 <div class="card"><h2>Phases</h2>${S.phases.map((p,i)=>`<div class="pl" onclick="openPh(${i})"><div class="no">${i+1}</div>
 <div class="mid"><b>${esc(p.name)}</b><div class="bar"><i style="width:${pct(p)}%"></i></div></div>${badge(p.status)}</div>`).join("")}</div>`;
}

// 6c. Détail d'une phase : statut, dates, tâches (avec 3 durées PERT), photos, notes
function estBox(id){const e=EST[id]||{};return `<div class="estbox"><div class="dates3">
 <label>Optimiste o (jours)<input type="number" id="eo-${id}" min="0" step="0.5" value="${e.o??""}" oninput="estPreview('${id}')"></label>
 <label>Probable m (jours)<input type="number" id="em-${id}" min="0" step="0.5" value="${e.m??""}" oninput="estPreview('${id}')"></label>
 <label>Pessimiste p (jours)<input type="number" id="ep-${id}" min="0" step="0.5" value="${e.p??""}" oninput="estPreview('${id}')"></label></div>
 <div class="row"><button class="b alt" onclick="saveEstimate('${id}')">Enregistrer les durées</button><span class="mu" id="pv-${id}">${estLabel(id)}</span></div>
 <div class="mu">o = tout se passe bien · m = conditions normales · p = intempéries, retards de livraison… Moyenne = (o + 4m + p) / 6</div></div>`}
function phase(){
 const p=S.phases[cur];
 const dates=[["ts","Début prévu"],["as","Début réel"],["te","Fin prévue"],["ae","Fin réelle"]]
  .map(([k,l])=>`<div><label>${l}</label><input type="date" value="${p[k]}" onchange="setDate('${k}',this.value)"></div>`).join("");
 const tasks=p.tasks.map((t,j)=>`<div class="task ${t.d?"d":""}" style="flex-wrap:wrap"><input type="checkbox" ${t.d?"checked":""} onchange="tick(${j})"><span style="flex:1">${esc(t.t)}</span><span class="mu" id="es-${t.id}">${estLabel(t.id)}</span><button class="b gh" title="Durées PERT" onclick="toggleBox('est-${t.id}')">⏱</button><button class="b gh" title="Photos" onclick="toggleBox('box-${t.id}')">📎</button><div id="est-${t.id}" style="display:none;width:100%">${estBox(t.id)}</div><div id="box-${t.id}" style="display:none;width:100%">${attachBox('task',t.id)}</div></div>`).join("");
 const notes=p.notes.map(n=>`<div class="task"><span class="mu">${n.d}${n.by?" · "+esc(n.by):""}</span><span>${esc(n.t)}</span></div>`).join("");
 // Durée estimée de la phase = somme des moyennes ; écart-type = racine de la somme des variances
 let mu=0,va=0,nb=0;p.tasks.forEach(t=>{const e=EST[t.id];if(e){const s=pert(e.o,e.m,e.p);mu+=s.mean;va+=s.sd*s.sd;nb++}});
 const sum=nb?`<p class="mu">⏱ Durée estimée de la phase : <b>${num(mu)} j</b> (σ = ${num(Math.sqrt(va))} j) — ${nb}/${p.tasks.length} tâches estimées</p>`:"";
 return `<button class="b gh" style="margin-bottom:10px" onclick="view='dash';render()">← Tableau de bord</button>
 <div class="card"><h2>${cur+1}. ${esc(p.name)}</h2>
 <div class="row">${badge(p.status)}<select onchange="setStatus(this.value)">${STAT.map(s=>`<option value="${s}" ${s===p.status?"selected":""}>${STL[s]}</option>`).join("")}</select><b>${pct(p)}%</b></div>
 <div class="bar"><i style="width:${pct(p)}%"></i></div>${sum}<div class="dates" style="margin-top:12px">${dates}</div></div>
 <div class="card"><h3>Tâches</h3>${tasks}
 <div class="row"><input id="nt" placeholder="Nouvelle tâche" style="flex:1"><button class="b alt" onclick="addTask()">Ajouter</button></div></div>
 <div class="card"><h3>Photos de la phase</h3>${attachBox('phase','p'+cur)}</div>
 <div class="card"><h3>Observations</h3>${notes}
 <div class="row"><input id="nn" placeholder="Observation" style="flex:1"><button class="b alt" onclick="addNote()">Ajouter</button></div></div>`;
}

const journal=()=>`<div class="card"><h2>Ajouter un événement</h2><div class="row"><input id="ed" type="date" value="${today()}">
 <input id="et" placeholder="ex. Béton coulé" style="flex:1"><button class="b alt" onclick="addEv()">Ajouter</button></div></div>
 <div class="card"><h2>Journal du projet</h2><div class="tl">${
 [...S.ev].sort((a,b)=>b.d.localeCompare(a.d)).map(e=>`<div class="e"><b>${e.d}</b>${e.by?` <span class="mu">· ${esc(e.by)}</span>`:""}<br>${esc(e.t)}</div>`).join("")}</div></div>`;

function admin(){const P=S.proj;return `<div class="card"><h2>Détails du projet</h2><div class="dates">
 <div><label>Nom</label><input id="pn" value="${esc(P.name)}"></div><div><label>Lieu</label><input id="pl" value="${esc(P.loc)}"></div>
 <div><label>Date de début</label><input id="ps" type="date" value="${P.start}"></div><div><label>Fin prévue</label><input id="pe" type="date" value="${P.end}"></div>

 <div class="row"><button class="b" onclick="saveProj()">Enregistrer</button>
 <button class="b gh" onclick="if(confirm('Supprimer ce projet et en démarrer un nouveau ?')){S=null;save();render()}">Nouveau projet</button></div></div>
 <div class="card"><h2>Comptes des intervenants</h2><div id="ulist" class="tw"><p class="mu">Chargement…</p></div>
 <h3 style="margin-top:14px">Ajouter un intervenant</h3><div class="dates">
 <div><label>Nom complet</label><input id="un" placeholder="Marie Nkoa"></div>
 <div><label>Identifiant</label><input id="uu" placeholder="mnkoa" autocapitalize="none"></div>

/* ===================== ÉTAPE 7 — ACTIONS (modifient S, enregistrent, redessinent) ===================== */
function openPh(i){cur=i;view="phase";render()}
function setStatus(s){const p=S.phases[cur];p.status=s;
 if(s==="Completed"){p.tasks.forEach(t=>t.d=true);p.ae=p.ae||today()}
 if(s==="In Progress"&&!p.as)p.as=today();
 log(`${p.name} : ${STL[s]}`);save();render()}
function setDate(k,v){S.phases[cur][k]=v;save()}
function tick(j){const p=S.phases[cur],t=p.tasks[j];t.d=!t.d;
 if(t.d)log(`Tâche terminée : ${t.t}`);
 if(p.tasks.every(x=>x.d)&&p.status!=="Completed"){p.status="Completed";p.ae=today();log(`${p.name} terminée`)}
 else if(t.d&&p.status==="Not Started"){p.status="In Progress";p.as=p.as||today();log(`${p.name} démarrée`)}
 save();render()}
function addTask(){const v=document.getElementById("nt").value.trim();if(!v)return;S.phases[cur].tasks.push({id:uid(),t:v,d:false});save();render()}
function addNote(){const v=document.getElementById("nn").value.trim();if(!v)return;S.phases[cur].notes.push({d:today(),t:v,by:by()});log("Observation ajoutée");save();render()}

// ---- 7a. Durées PERT d'une tâche ----
function toggleBox(id){const b=document.getElementById(id);b.style.display=b.style.display==="none"?"block":"none"}   // id = id complet de la boîte
function estPreview(id){const g=k=>parseFloat(document.getElementById(k+"-"+id).value),o=g("eo"),m=g("em"),p=g("ep"),pv=document.getElementById("pv-"+id);
 if([o,m,p].some(isNaN)){pv.textContent="";return}
 if(!(o<=m&&m<=p)){pv.textContent="⚠ il faut o ≤ m ≤ p";return}
 const s=pert(o,m,p);pv.textContent=`μ = ${num(s.mean)} j · σ = ${num(s.sd)} j`}
async function saveEstimate(taskId){
 const g=k=>parseFloat(document.getElementById(k+"-"+taskId).value);
 const optimistic=g("eo"),probable=g("em"),pessimistic=g("ep");
 if([optimistic,probable,pessimistic].some(isNaN))return alert("Remplissez les trois durées.");
 try{
  await api("PUT","/api/estimates/"+encodeURIComponent(taskId),{optimistic,probable,pessimistic});
  EST[taskId]={o:optimistic,m:probable,p:pessimistic,by:by()};
  document.getElementById("es-"+taskId).textContent=estLabel(taskId);
  flash("Durées enregistrées.");
 }catch(e){alert(e.message)}
}

// ---- 7b. Photos (pour tâches, phases, rapports) ----
function shrink(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,1280/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;
 c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(f)})}
function attachBox(type,id){return `<div class="gal" data-type="${type}" data-id="${id}"></div><div class="row">
 <input type="file" id="f-${id}" accept="image/*" capture="environment" multiple>
 <input id="d-${id}" placeholder="Description" style="flex:1"><button class="b alt" onclick="sendFiles('${type}','${id}')">Joindre</button></div>`}
async function sendFiles(type,id){
 const files=[...document.getElementById("f-"+id).files],d=document.getElementById("d-"+id).value;
 if(!files.length)return alert("Choisissez d'abord une photo.");
 try{for(const f of files)await api("POST","/api/attachments",{ownerType:type,ownerId:id,description:d,dataUrl:await shrink(f)});
  document.getElementById("f-"+id).value="";document.getElementById("d-"+id).value="";loadGalleries()}
 catch(e){alert("Échec de l'envoi : "+e.message)}}
async function loadGalleries(){for(const g of document.querySelectorAll(".gal[data-id]")){try{
 const l=await api("GET",`/api/attachments?ownerType=${g.dataset.type}&ownerId=${encodeURIComponent(g.dataset.id)}`);
 g.innerHTML=l.map(a=>`<figure><img loading="lazy" src="/uploads/${a.file}" onclick="window.open('/uploads/${a.file}')">${esc(a.description)} <a href="#" onclick="delAtt('${a.id}');return false">✕</a></figure>`).join("")||'<span class="mu">Aucune photo.</span>'}catch(e){}}}
async function delAtt(id){if(confirm("Supprimer cette photo ?")){await api("DELETE","/api/attachments/"+id).catch(e=>alert(e.message));loadGalleries()}}

 <div><label>Météo</label><input id="rw" placeholder="Soleil / Pluie"></div><div><label>Ouvriers sur site</label><input id="rn" type="number"></div></div>
 <div class="row"><input id="rs" placeholder="Résumé de la journée" style="width:100%"></div><button class="b" onclick="addReport()">Enregistrer le rapport</button></div>
 ${[...S.reports].reverse().map(r=>`<div class="card"><b>${r.date}</b> · ${esc(S.phases[r.phase].name)} · ${esc(r.weather)} · ${r.workers} ouvriers${r.by?` · <span class="mu">${esc(r.by)}</span>`:""}<p>${esc(r.summary)}</p>${attachBox('report',r.id)}</div>`).join("")}`}
function addReport(){const g=i=>document.getElementById(i).value;if(!g("rs").trim())return alert("Écrivez un résumé.");
 S.reports.push({id:uid(),date:g("rd")||today(),phase:+g("rp"),weather:g("rw"),workers:+g("rn")||0,summary:g("rs").trim(),by:by()});

function saveProj(){const g=i=>document.getElementById(i).value;

// ---- 7d. SIMULATION PROBABILISTE ----
function sim(){return `<div class="card"><h2>Simulation probabiliste de fin de chantier</h2>
 <p class="mu">Moyenne PERT d'une tâche = (o + 4m + p) / 6 · écart-type = (p − o) / 6 · les durées sont tirées au hasard (loi Bêta-PERT) 5 000 fois et additionnées (tâches enchaînées).</p>
 <div class="row"><label><input type="checkbox" ${SIM.remaining?"checked":""} onchange="SIM.remaining=this.checked;runSim()"> Tâches restantes seulement</label>
 <input id="st" type="number" min="0" step="1" placeholder="Délai visé (jours)" value="${esc(SIM.target)}" onkeydown="if(event.key==='Enter')applyTarget()">
 <button class="b" onclick="applyTarget()">Calculer</button></div></div><div id="simbox"><p class="mu">Calcul en cours…</p></div>`}
function applyTarget(){SIM.target=document.getElementById("st").value;runSim()}
function showSimulation(){view="sim";render()}                 // bouton « Simulation » de la navigation
async function runSim(){
 const box=document.getElementById("simbox");if(!box)return;
 try{
  const d=await api("GET","/api/simulation?remaining="+(SIM.remaining?1:0)+(SIM.target!==""?"&target="+encodeURIComponent(SIM.target):""));
  if(d.error){box.innerHTML=`<div class="card"><p>${esc(d.error)}</p></div>`;return}
  const miss=d.missing.length?`<div class="warn">⚠ ${d.missing.length} tâche(s) sans durées ne sont pas comptées (ex. : ${esc(d.missing.slice(0,3).map(t=>t.label).join(", "))}). Le résultat est donc <b>sous-estimé</b> tant qu'elles ne sont pas renseignées (bouton ⏱ dans la phase).</div>`:"";
  const prob=d.target!==undefined?`<div class="card"><h2>${Math.round(d.probTarget*100)} % de chances de finir en ${num(d.target)} jours</h2>
   <p class="mu">Simulation de Monte Carlo. Approximation par la loi normale (μ, σ) : ${Math.round(d.probTargetNormal*100)} %.</p></div>`:"";
  box.innerHTML=`${miss}
  <div class="grid g4" style="margin-bottom:14px">
   <div class="card metric"><div class="n">${num(d.mean)} j</div><div class="mu">Durée moyenne (μ)</div></div>
   <div class="card metric"><div class="n">${num(d.sd)} j</div><div class="mu">Écart-type (σ)</div></div>
   <div class="card metric"><div class="n">${d.nbTasks}</div><div class="mu">Tâches simulées</div></div>
   <div class="card metric"><div class="n">${d.iterations}</div><div class="mu">Tirages de Monte Carlo</div></div></div>${prob}
  <div class="card"><ul>
   <li><b>${num(d.p10)} jours</b> : scénario optimiste (10 % de chances de finir avant)</li>
   <li><b>${num(d.p50)} jours</b> : scénario médian (50 % de chances)</li>
   <li><b>${num(d.p80)} jours</b> : scénario prudent — recommandé pour planifier (80 % de chances)</li>
   <li><b>${num(d.p90)} jours</b> : scénario pessimiste (90 % de chances)</li></ul>
   <canvas id="hist-canvas" width="700" height="300"></canvas>
   <div class="mu">Chaque barre = nombre de tirages qui ont fini à cette durée. Traits : médiane (gris), P80 (orange)${d.target!==undefined?", délai visé (vert)":""}.</div></div>
  <div class="card"><h3>Tâches qui pèsent le plus sur l'incertitude</h3><div class="tw"><table>
   <tr><th>Tâche</th><th class="n">o</th><th class="n">m</th><th class="n">p</th><th class="n">μ</th><th class="n">σ</th><th class="n">Part</th></tr>
   ${d.tasks.map(t=>`<tr><td>${esc(t.label)}<br><span class="mu">${esc(t.phase)}</span></td><td class="n">${num(t.o)}</td><td class="n">${num(t.m)}</td><td class="n">${num(t.p)}</td>
   <td class="n">${num(t.mean)}</td><td class="n">${num(t.sd)}</td><td class="n">${Math.round(t.share*100)} %</td></tr>`).join("")}</table></div></div>`;
  drawHistogram(d.histogram,[{v:d.p50,c:"#64748b"},{v:d.p80,c:"#f97316"},...(d.target!==undefined?[{v:d.target,c:"#16a34a"}]:[])],d.target);
 }catch(e){box.innerHTML=`<div class="card"><p>${esc(e.message)}</p></div>`}
}
function drawHistogram(h,marks=[],target){
 const canvas=document.getElementById("hist-canvas");if(!canvas)return;
 const ctx=canvas.getContext("2d"),maxCount=Math.max(...h.counts),barWidth=canvas.width/h.counts.length,span=(h.max-h.min)||1;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 h.counts.forEach((count,i)=>{
  const barHeight=(count/maxCount)*(canvas.height-30),right=h.min+(i+1)*h.width;
  ctx.fillStyle=(target!==undefined&&right<=target)?"#16a34a":"#2E5B88";        // barres vertes = finies dans le délai visé
  ctx.fillRect(i*barWidth+1,canvas.height-barHeight-20,barWidth-2,barHeight)});
 marks.forEach(m=>{const x=(m.v-h.min)/span*canvas.width;if(x<0||x>canvas.width)return;
  ctx.strokeStyle=m.c;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height-20);ctx.stroke()});
 ctx.fillStyle="#333";ctx.font="12px sans-serif";
 ctx.fillText(Math.round(h.min)+" j",2,canvas.height-2);
 ctx.fillText(Math.round(h.max)+" j",canvas.width-40,canvas.height-2);
}

/* ===================== ÉTAPE 8 — RENDER (l'aiguilleur) ===================== */
function render(){
 typing=false;needsRender=false;
 const nav=document.getElementById("nav"),app=document.getElementById("app"),who=document.getElementById("who");
 if(!ME){nav.innerHTML="";who.innerHTML="";app.innerHTML=loginScreen();return}
 who.innerHTML=`<span>${esc(ME.name)} · ${ROLEL[ME.role]}</span><button class="b gh" onclick="logout()">Déconnexion</button>`;
 if(!S){nav.innerHTML=`<button class="${view==="compte"?"on":""}" onclick="view='compte';render()">Compte</button>`;
  app.innerHTML=view==="compte"?compte():welcome();return}
 migrate();
 const tabs=[["dash","Tableau de bord"],["phase","Phases"],["journal","Journal"],["reports","Rapports"],["sim","Simulation"]];
 if(ME.role==="admin")tabs.push(["admin","Admin"]);
 tabs.push(["compte","Compte"]);
 if(!tabs.some(([k])=>k===view))view="dash";
 nav.innerHTML=tabs.map(([k,l])=>`<button class="${view===k?"on":""}" onclick="view='${k}';render()">${l}</button>`).join("");
 const html={dash,phase,journal,reports,sim,admin,compte}[view]();
 app.innerHTML=RO()?`<fieldset disabled>${html}</fieldset>`:html;      // lecture seule : champs et boutons grisés
 window.scrollTo(0,0);loadGalleries();
 if(view==="sim")runSim();if(view==="admin")loadUsers();
}

async function boot(){
 try{const s=await api("GET","/api/session");ME=s.user;SETUP=s.needsSetup}
 catch(e){document.getElementById("app").innerHTML=`<div class="card hero"><p>Serveur injoignable : ${esc(e.message)}</p></div>`;return}
 if(ME){try{const j=await api("GET","/api/state");S=j.json?JSON.parse(j.json):null;VER=j.version;BASE=j.json;EST=await api("GET","/api/estimates")}catch(e){S=null}}
 view="dash";render()}
boot();
